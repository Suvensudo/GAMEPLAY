<html class=""><head>
        <meta charset="utf-8">
<script src="./assets/boot.js"></script>
        <style>
            .error-boundary {
                border: 2px dashed rgba(255, 0, 0, 0.3);
                position: relative;
            }
            .error-boundary::after {
                content: "⚠️";
                position: absolute;
                top: 0;
                right: 0;
                background: rgba(255, 0, 0, 0.1);
                color: red;
                font-size: 14px;
                padding: 2px 6px;
                border-radius: 0 0 0 4px;
                pointer-events: none;
            }
            .loading-spinner {
                @apply flex items-center justify-center;
                @apply min-h-[200px];
                @apply bg-gradient-to-br from-white/5 to-white/10;
                @apply rounded-xl;
                @apply backdrop-blur-sm;
            }
            .loading-spinner::after {
                content: '';
                @apply w-12 h-12;
                @apply border-4 border-primary/20;
                @apply border-t-primary;
                @apply rounded-full;
                @apply animate-spin;
                @apply shadow-lg;
            }

            /* Base text and background colors for all elements */
            body {
                @apply bg-background text-foreground;
            }

            /* Form elements styling */
            input, textarea, select {
                @apply bg-background text-foreground border-input;
                @apply placeholder:text-muted-foreground;
                @apply focus:outline-none focus:ring-2 focus:ring-ring;
            }

            /* Handle filled state */
            input:not(:placeholder-shown),
            textarea:not(:placeholder-shown),
            select:not(:placeholder-shown) {
                @apply bg-background;
            }

            /* Ensure proper contrast in both modes */
            .dark input, .dark textarea, .dark select {
                @apply bg-background/95;
            }

            input, textarea, select {
                @apply bg-background/95;
            }

            /* Handle disabled state */
            input:disabled,
            textarea:disabled,
            select:disabled {
                @apply opacity-50 cursor-not-allowed;
            }

            /* Button styling */
            button {
                @apply bg-primary text-primary-foreground hover:bg-primary/90;
                @apply disabled:opacity-50 disabled:cursor-not-allowed;
                @apply focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2;
            }

            /* Secondary button variant */
            button.secondary {
                @apply bg-secondary text-secondary-foreground hover:bg-secondary/80;
            }

            /* Card styling */
            .card {
                @apply bg-card text-card-foreground;
                @apply border border-border;
                @apply rounded-lg shadow-sm;
            }

            /* Popover and dropdown styling */
            .popover {
                @apply bg-popover text-popover-foreground;
                @apply border border-border;
                @apply shadow-md rounded-md;
            }

            /* Link styling */
            a {
                @apply text-primary hover:text-primary/80;
                @apply focus:outline-none focus:ring-2 focus:ring-ring;
            }

            /* Muted text */
            .text-muted {
                @apply text-muted-foreground;
            }

            /* Accent backgrounds */
            .bg-accent {
                @apply bg-accent text-accent-foreground;
            }

            /* Destructive elements */
            .destructive {
                @apply bg-destructive text-destructive-foreground hover:bg-destructive/90;
            }

            /* Code blocks and pre elements */
            pre, code {
                @apply bg-muted text-muted-foreground;
                @apply rounded px-[0.3em] py-[0.2em];
            }

            /* Table styling */
            table {
                @apply border-collapse w-full;
            }

            th, td {
                @apply border border-border;
                @apply p-2 text-left;
            }

            th {
                @apply bg-muted font-semibold;
            }

            /* Badge/tag styling */
            .badge {
                @apply inline-flex items-center rounded-full;
                @apply px-2.5 py-0.5 text-xs font-semibold;
                @apply bg-primary/10 text-primary-foreground;
            }

            /* Focus outline for accessibility */
            :focus-visible {
                @apply outline-none ring-2 ring-ring ring-offset-2;
            }

            /* Selection styling */
            ::selection {
                @apply bg-primary/20 text-foreground;
            }
        </style>

<!-- ===== ANALITIK (Umami Cloud) =====================================
     Cerezsiz + kisisel veri toplamaz -> onay banner'i GEREKMEZ.
     Amac: "oyuncular hangi seviyede birakiyor" sorusunu cevaplamak.
     ONEMLI: ND_UMAMI_ID bos/placeholder iken HICBIR istek yapilmaz,
     hicbir dis script yuklenmez -> oyun %100 eskisi gibi calisir.
     Website ID'yi alinca SADECE asagidaki tek satiri degistir. -->
<script>
  window.ND_UMAMI_ID = "22d25e30-03df-4b33-b7b6-4b8f7ddb8ac1";

  /* ndTrack: olay gonderir. Umami scripti henuz yuklenmediyse olayi
     kuyruga alir, script gelince sirayla gonderir -> ilk saniyelerdeki
     olaylar kaybolmaz. Hata olursa sessizce yutar: analitik oyunu bozmaz. */
  window.ndTrack = (function () {
    var queue = [];
    function ready() { return typeof window.umami !== "undefined" && window.umami.track; }
    function flush() {
      if (!ready()) return false;
      while (queue.length) {
        var ev = queue.shift();
        try { window.umami.track(ev.n, ev.d); } catch (e) {}
      }
      return true;
    }
    window.ndFlush = flush;
    return function (name, data) {
      var ev = { n: name, d: data || {} };
      if (flush()) { try { window.umami.track(ev.n, ev.d); } catch (e) {} return; }
      if (queue.length < 20) queue.push(ev);
    };
  })();

  (function () {
    if (!window.ND_UMAMI_ID) return;
    var h = location.hostname;
    /* Yerel testler (1-OYUNU-AC.bat, localhost, dosyadan acma) istatistigi
       kirletmesin diye sadece GERCEK alan adinda calisir. */
    if (location.protocol === "file:" || !h || h === "localhost" || h === "127.0.0.1") return;
    var s = document.createElement("script");
    s.defer = true;
    s.src = "https://cloud.umami.is/script.js";
    s.setAttribute("data-website-id", window.ND_UMAMI_ID);
    s.onload = function () { try { window.ndFlush(); } catch (e) {} };
    document.head.appendChild(s);
  })();

  /* ===== ODULLU REKLAM (portal SDK'si) ================================
     KURAL: reklam SADECE oyuncunun kendi secimiyle, asla araya giren reklam.
     Reklam yalnizca PORTALDA calisir (oyun iframe icinde) veya ?ads=test ile.
     Kendi sitemizde SDK hic yuklenmez -> reklam yok, oyun ayni kalir, ek istek yok.
     Portalda SDK bulunursa odul butonu otomatik gorunur; bulunmazsa gizlenir. */
  /* PORTAL SES AYARI (CrazyGames): portal "sesi kapat" derse oyunun kendi ses
     dugmesi acik olsa bile ses kapali kalir (SDK kurali). Reklam oynarken de
     susar. Portal yoksa hicbir sey yapmaz; ?muteAudio=true ile yerelde test edilir. */
  window.ndPortalAudio = (function () {
    function sdk() { return window.CrazyGames && window.CrazyGames.SDK; }
    var base = false;
    function apply(on) {
      window.ndMute = !!on;
      try { if (typeof window.ndForceMute === "function") window.ndForceMute(window.ndMute); } catch (e) {}
    }
    function read() {
      var m = false;
      try { var st = sdk() && sdk().game && sdk().game.settings; if (st) m = !!st.muteAudio; } catch (e) {}
      base = m;
      apply(m);
    }
    return {
      init: function () {
        read();
        /* read() portaldan geleni uygular; test parametresi ondan SONRA gelmeli. */
        if (/[?&]muteAudio=true/.test(location.search)) { base = true; apply(true); }
        try {
          var g = sdk() && sdk().game;
          if (!g) return;
          var fn = g.addSettingsChangeListener || g.onSettingsChange || g.addSettingsChangeCallback;
          if (typeof fn === "function") fn.call(g, read);
        } catch (e) {}
      },
      adMute: function (on) { apply(on ? true : base); }
    };
  })();

  /* Her durumda bir kez calistir: window.ndMute net bir deger alir (false).
     SDK yuklendiginde a.onload icinde tekrar cagrilir ve portal ayarini uygular. */
  try { window.ndPortalAudio.init(); } catch (e) {}

  /* PORTAL OYUN DURUMU (CrazyGames): "oyun basladi / bitti" sinyali.
     Portal yoksa hicbir sey yapmaz; kendi sitemizde etkisizdir.
     Basic Launch icin sart degil, Full Launch icin zorunlu. */
  window.ndGameplay = (function () {
    var on = false;
    function call(fn) {
      try {
        var s = window.CrazyGames && window.CrazyGames.SDK;
        if (s && s.game && typeof s.game[fn] === "function") s.game[fn]();
      } catch (e) {}
    }
    return {
      start: function () { if (on) return; on = true; call("gameplayStart"); },
      stop: function () { if (!on) return; on = false; call("gameplayStop"); }
    };
  })();

  window.ndAds = (function () {
    var test = /[?&]ads=test/.test(location.search);
    var inFrame = false;
    try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
    function sdk() { return window.CrazyGames && window.CrazyGames.SDK; }
    function ready() { var s = sdk(); return !!(s && s.ad && s.ad.requestAd); }

    if (inFrame && !test) {
      var a = document.createElement("script");
      a.defer = true;
      a.src = "https://sdk.crazygames.com/crazygames-sdk-v3.js";
      a.onload = function () { try { var s = sdk(); s && s.init && s.init(); if (window.ndPortalAudio) window.ndPortalAudio.init(); } catch (e) {} };
      document.head.appendChild(a);
    }

    return {
      available: function () { return test || ready(); },
      isTest: function () { return test; },
      /* GECIS REKLAMI: oyunun dogal duraklama aninda (seviye gecisi).
         SDK yoksa veya hata olursa sessizce devam eder — oyun asla takilmaz. */
      showMidgame: function (onDone) {
        var done = false;
        function finish() { if (done) return; done = true; if (onDone) onDone(); }
        if (test) { setTimeout(finish, 900); return; }
        if (!ready()) { finish(); return; }
        try {
          sdk().ad.requestAd("midgame", {
            adStarted: function () { if (window.ndPortalAudio) window.ndPortalAudio.adMute(true); },
            adFinished: function () { if (window.ndPortalAudio) window.ndPortalAudio.adMute(false); finish(); },
            adError: function () { if (window.ndPortalAudio) window.ndPortalAudio.adMute(false); finish(); }
          });
        } catch (e) { finish(); }
        setTimeout(finish, 9000);  /* guvenlik: SDK sessiz kalirsa oyun devam etsin */
      },
      showRewarded: function (onReward, onFail) {
        if (test) { setTimeout(onReward, 900); return; }  /* test: aninda odul */
        if (!ready()) { if (onFail) onFail(); return; }
        try {
          sdk().ad.requestAd("rewarded", {
            adStarted: function () { if (window.ndPortalAudio) window.ndPortalAudio.adMute(true); },
            adFinished: function () { if (window.ndPortalAudio) window.ndPortalAudio.adMute(false); if (onReward) onReward(); },
            adError: function () { if (window.ndPortalAudio) window.ndPortalAudio.adMute(false); if (onFail) onFail(); }
          });
        } catch (e) { if (onFail) onFail(); }
      }
    };
  })();
</script>
